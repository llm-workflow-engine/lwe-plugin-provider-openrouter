[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lwe-plugin-provider-openrouter"
dynamic = ["version"]
description = "LWE plugin: OpenRouter Provider plugin"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "Chad Phillips", email = "chad@apartmentlines.com" },
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-datadir",
    "pip-tools",
    "basedpyright",
    "flake8",
    "black",
]

[project.urls]
Homepage = "https://github.com/llm-workflow-engine/lwe-plugin-provider-openrouter"
Repository = "https://github.com/llm-workflow-engine/lwe-plugin-provider-openrouter"

[project.entry-points."lwe_plugins"]
lwe_plugin_provider_openrouter = "lwe_plugin_provider_openrouter.plugin:ProviderOpenrouter"

[tool.setuptools.dynamic]
version = { attr = "lwe_plugin_provider_openrouter.version.__version__" }

[tool.setuptools.packages.find]
include = ["lwe_plugin_provider_openrouter*"]
